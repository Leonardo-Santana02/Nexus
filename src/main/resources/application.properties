spring.application.name=nexus
spring.config.import=optional:file:./.booknexus-local.properties
spring.datasource.url=${BOOKNEXUS_DB_URL:jdbc:postgresql://localhost/booknexus}
spring.datasource.username=${BOOKNEXUS_DB_USER:postgres}
spring.datasource.password=${BOOKNEXUS_DB_PASSWORD:${booknexus.local.db-password:}}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

booknexus.chat.endpoint=${BOOKNEXUS_CHAT_ENDPOINT:${booknexus.local.chat-endpoint:http://127.0.0.1:8081/v1/chat/completions}}
booknexus.chat.modelo=${BOOKNEXUS_CHAT_MODEL:${booknexus.local.chat-model:booknexus-qwen-base}}
booknexus.chat.timeout-segundos=${BOOKNEXUS_CHAT_TIMEOUT:90}
